name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: dtolnay/cargo@v1
        with:
          command: fmt
          args: --all -- --check
      - uses: dtolnay/cargo@v1
        with:
          command: clippy
          args: --all-targets --all-features -- -D warnings
      - uses: dtolnay/cargo@v1
        with:
          command: test
          args: --workspace
